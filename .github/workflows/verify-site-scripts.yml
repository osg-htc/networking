name: Verify docs -> site script sync

# Checks every helper script in docs/perfsonar/tools_scripts: per-file and
# scripts.sha256 checksums, and version header vs VERSION variable. Read-only:
# to fix checksum failures run
#   bash .github/scripts/update-script-checksums.sh
# locally and commit the result.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  verify-site-scripts:
    name: Verify docs/site scripts and SHA integrity
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify script checksums and versions
      run: bash .github/scripts/verify-site-scripts.sh
